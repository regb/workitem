syntax = "proto3";

package wi.core.v1;

import "google/protobuf/timestamp.proto";
import "wi/core/v1/common.proto";

option go_package = "github.com/regb/workitem/gen/wi/core/v1;corev1";

// JobService reports operations that can outlive the request that started
// them, such as setting up a checkout, starting an agent, synchronizing a
// repository, integrating an item, or starting an item. A job keeps running when its client
// disconnects. Its final state is read through the domain services, such as
// ItemService.GetItem; the job reports progress and outcome.
// Summaries are committed to the daemon database before being published.
// Summaries survive restart; execution does not resume.
// A job unfinished when the daemon stops is recovered as FAILED with error
// "interrupted by a daemon restart", preserving its last recorded progress and
// partial outcome. History retains the latest 500
// finished summaries plus all unfinished jobs. Older IDs return NOT_FOUND.
service JobService {
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListJobs reads recent and running jobs, optionally for one item.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchJob streams the job's state and progress until it finishes. The
  // first message is the current state, so a late watcher misses nothing
  // that matters.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
  // CancelJob asks a running job to stop. Steps already done are kept and
  // reported as its partial outcome.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

// JobState is where a job is in its life.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  reserved 3;
  reserved "JOB_STATE_WAITING_FOR_APPROVAL";
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
}

// Job is one long operation.
message Job {
  string id = 1;
  // kind names the operation, such as "start_item", "setup_workspace",
  // "start_agent", "integrate_item" or "sync_repository". New kinds may be
  // added; clients show unknown ones by name.
  string kind = 2;
  JobState state = 3;
  // item_id and repository_id name what the job works on, when it does.
  string item_id = 4;
  string repository_id = 5;
  // phase is the step running now, for display, such as "setting up the
  // checkout" or "starting the agent".
  string phase = 6;
  // log_tail is the end of the job's log, such as setup command output.
  string log_tail = 7;
  reserved 8;
  reserved "approval";
  // error explains a failure; partial says what was kept.
  string error = 9;
  PartialOutcome partial = 10;
  repeated string warnings = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  // result is what a job that succeeded produced, for the kinds that
  // produce something a client would otherwise re-read state to learn.
  // Other kinds, and a job that failed or was cancelled, have none.
  oneof result {
    // integration is an integrate_item's merge.
    IntegrationResult integration = 15;
    // repository_sync is a sync_repository's outcome.
    RepositorySyncResult repository_sync = 16;
    // agent_start is the agent a job started: start_item, start_agent,
    // restart_agent, or a send_message or acquire_control that started it.
    AgentStartResult agent_start = 17;
    // title is the title a suggest_title gave the item.
    TitleResult title = 18;
    // command is how a run_command's command ended.
    CommandResult command = 19;
  }
}

// IntegrationResult is what integrating an item did.
message IntegrationResult {
  // commit is the target branch's new commit.
  string commit = 1;
  string target_branch = 2;
  // revision_id is the review revision captured as the merge's input.
  string revision_id = 3;
}

// RepositorySyncResult is what synchronizing a repository did.
message RepositorySyncResult {
  // changed means the repository's branch moved.
  bool changed = 1;
  string local_sha = 2;
  string upstream_sha = 3;
  // recovery_ref keeps the commits a reset to upstream left behind, when
  // there were any.
  string recovery_ref = 4;
}

// AgentStartResult is the agent a job started.
message AgentStartResult {
  // generation is the agent's new generation, which fences what is sent to
  // it.
  uint32 generation = 1;
  AgentMode mode = 2;
}

// TitleResult is the title a job chose for an item.
message TitleResult {
  // title is the title the model wrote, now the item's.
  string title = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  string item_id = 1;
  // running_only omits finished jobs.
  bool running_only = 2;
  // page_size bounds the page: zero, or more than 500, is 500.
  uint32 page_size = 3;
  // page_token continues from next_page_token. Offset-based, best-effort
  // under concurrent changes; later pages may shift.
  string page_token = 4;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  // next_page_token continues the list; empty on its last page.
  string next_page_token = 2;
}

message WatchJobRequest {
  string job_id = 1;
}

message WatchJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

// CommandResult is how a command a person ran ended.
message CommandResult {
  // exit_code is its exit status; a command stopped by a signal, such as
  // its timeout, is -1.
  int32 exit_code = 1;
}
