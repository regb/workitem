syntax = "proto3";

package wi.core.v1;

import "google/protobuf/struct.proto";
import "wi/core/v1/agents.proto";

option go_package = "github.com/regb/workitem/gen/wi/core/v1;corev1";

// AgentProfileService manages agent profiles: a driver and the settings it
// launches with. Items name the profile they use. Authentication stays with
// each agent.
service AgentProfileService {
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PutAgentProfile adds or replaces a profile. The first one added becomes
  // the default.
  rpc PutAgentProfile(PutAgentProfileRequest) returns (PutAgentProfileResponse);
  // DeleteAgentProfile removes a profile that is not the default. Items
  // using it keep its name and ask to move when they next start.
  rpc DeleteAgentProfile(DeleteAgentProfileRequest) returns (DeleteAgentProfileResponse);
  rpc SetDefaultAgentProfile(SetDefaultAgentProfileRequest) returns (SetDefaultAgentProfileResponse);
  // SetTitleModel sets the model that writes item titles, or clears it so
  // the default profile's model does. It is a bare model, called without
  // tools, workspace or conversation, whatever agent an item uses.
  rpc SetTitleModel(SetTitleModelRequest) returns (SetTitleModelResponse);
  // GetProfileModels lists the models and reasoning levels a profile's agent
  // offers, with the profile's own model and reasoning, so a client can
  // choose them for a new item, which takes them as agent_settings.
  rpc GetProfileModels(GetProfileModelsRequest) returns (GetProfileModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListDrivers lists the drivers profiles can use and their defaults.
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// AgentProfile is a named agent setup.
message AgentProfile {
  string name = 1;
  string driver = 2;
  string label = 3;
  // config is the driver's settings, such as executable, model and
  // reasoning. Its shape belongs to the driver. An item's agent gets none:
  // GetProfileModels gives it the profile's models.
  google.protobuf.Struct config = 4;
  // users counts the open items using the profile.
  uint32 users = 5;
}

// Driver is an agent driver wi can run.
message Driver {
  string name = 1;
  string label = 2;
  google.protobuf.Struct defaults = 3;
}

message ListAgentProfilesRequest {}

message ListAgentProfilesResponse {
  repeated AgentProfile profiles = 1;
  string default_profile = 2;
  uint32 revision = 3;
  // title_model is the model that writes item titles; unset, the default
  // profile's model does.
  ModelChoice title_model = 4;
}

// ModelChoice names a model by the driver that runs it. An empty model or
// reasoning takes the driver's default.
message ModelChoice {
  string driver = 1;
  string model = 2;
  string reasoning = 3;
}

message SetTitleModelRequest {
  // model is the title model; unset clears it.
  ModelChoice model = 1;
  uint32 expected_revision = 2;
}

message SetTitleModelResponse {
  uint32 revision = 1;
}

message PutAgentProfileRequest {
  AgentProfile profile = 1;
  uint32 expected_revision = 2;
}

message PutAgentProfileResponse {
  AgentProfile profile = 1;
  uint32 revision = 2;
}

message DeleteAgentProfileRequest {
  string name = 1;
  uint32 expected_revision = 2;
}

message DeleteAgentProfileResponse {
  uint32 revision = 1;
}

message SetDefaultAgentProfileRequest {
  string name = 1;
  uint32 expected_revision = 2;
}

message SetDefaultAgentProfileResponse {
  uint32 revision = 1;
}

message ListDriversRequest {}

message ListDriversResponse {
  repeated Driver drivers = 1;
}

message GetProfileModelsRequest {
  string name = 1;
}

message GetProfileModelsResponse {
  string driver = 1;
  // values are the profile's settings, such as model and reasoning, with the
  // driver's defaults; sensitive and executable settings are left out.
  map<string, string> values = 2;
  ModelCatalog catalog = 3;
  // catalog_error says why the driver could not list its models.
  string catalog_error = 4;
}
