syntax = "proto3";

package wi.core.v1;

import "google/protobuf/timestamp.proto";
import "wi/core/v1/jobs.proto";

option go_package = "github.com/regb/workitem/gen/wi/core/v1;corev1";

// SystemService describes and controls the daemon itself.
service SystemService {
  // GetInfo reads the daemon's version, API version, data location and
  // defaults. Clients call it first to check compatibility.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetHealth reports whether the daemon and its observations are healthy.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RunDiagnostics checks storage, projections, agents and adapters, as
  // wi daemon doctor does.
  rpc RunDiagnostics(RunDiagnosticsRequest) returns (RunDiagnosticsResponse);
  // GetConfig reads the daemon's effective global configuration, with
  // sensitive values redacted unless show_sensitive is set.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListPlugins lists registered plugins and their option schemas.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetUsage reads how much of each subscription's quota is left, as the
  // usage plugin reports it. It answers at once from the daemon's last
  // result: the daemon checks every five minutes while the API is in use
  // (any call within the last 30 minutes). refresh starts a check now in
  // the background; wait blocks until a check started now finishes. The
  // first call after the daemon starts always waits.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  // Shutdown stops agents and terminals, then the daemon. The reply is
  // sent before the daemon stops; the job reports the result to watchers
  // until then.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string version = 1;
  // api_version is this API's version; clients refuse a newer major.
  string api_version = 2;
  string data_root = 3;
  string default_agent_profile = 4;
  google.protobuf.Timestamp started_at = 5;
  // managed means a service manager runs the daemon.
  bool managed = 6;
  // caller is who made this call. It grants no permissions.
  Caller caller = 7;
}

// Caller is who a call is from, as the credential it presented proves:
// the local operator, wi web acting for its signed-in user, or a work item's
// agent. Wi-Client-Id identifies a lease client (default "cli").
// Wi-Client-Kind selects lease holder presentation ("terminal" or "web");
// neither header changes who the caller is.
message Caller {
  reserved 1;
  reserved "access";
  CallerKind kind = 2;
  // label is who the caller acts as, when known: for the web, the user the
  // web adapter's proxy authenticated.
  string label = 3;
  // principal names the caller: "user:operator", or "item:<id>" for an
  // item's agent.
  string principal = 4;
  // item_id is the item whose agent is calling, for CALLER_KIND_AGENT.
  string item_id = 5;
}

enum CallerKind {
  CALLER_KIND_UNSPECIFIED = 0;
  CALLER_KIND_LOCAL_OPERATOR = 1;
  CALLER_KIND_WEB_ADAPTER = 2;
  CALLER_KIND_AGENT = 3;
}

message GetHealthRequest {}

message GetHealthResponse {
  bool healthy = 1;
  repeated string problems = 2;
  google.protobuf.Timestamp last_observation_at = 3;
}

message RunDiagnosticsRequest {}

// Diagnostic is one check's result.
message Diagnostic {
  string check = 1;
  bool ok = 2;
  string detail = 3;
}

message RunDiagnosticsResponse {
  repeated Diagnostic diagnostics = 1;
}

message GetConfigRequest {
  bool show_sensitive = 1;
}

message GetConfigResponse {
  // config_json is the effective configuration as JSON, with origins.
  string config_json = 1;
}

// PluginOption describes one option a plugin declares.
message PluginOption {
  string name = 1;
  // type is "string", "bool", "int" or "string_list".
  string type = 2;
  string description = 3;
  bool sensitive = 4;
  bool repository_scope = 5;
  string default_json = 6;
}

// Plugin is a registered plugin. Plugins run outside the daemon: hooks are
// executables the daemon calls during core operations (checkout setup,
// agent environment); automation and commands are clients of this API. The
// daemon keeps the registry and the options plugins declare.
message Plugin {
  string name = 1;
  bool enabled = 2;
  bool bundled = 3;
  // hooks are the core operations the plugin takes part in, such as
  // "setup_checkout" or "agent_environment".
  repeated string hooks = 4;
  // commands are the CLI commands the plugin adds, run client-side.
  repeated string commands = 5;
  repeated PluginOption options = 6;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

message ShutdownRequest {
  // force stops busy agents too.
  bool force = 1;
}

message ShutdownResponse {
  Job job = 1;
}

message GetUsageRequest {
  // refresh asks the providers again rather than reading their cached
  // answers; the plugin allows this once a minute.
  bool refresh = 1;
  // wait returns only after the check this call started, if any, finishes.
  bool wait = 2;
}

message GetUsageResponse {
  // enabled is false when the usage plugin is not enabled.
  bool enabled = 1;
  repeated UsageQuota quotas = 2;
  // checked_at is when the daemon last finished a check; unset before the
  // first one.
  google.protobuf.Timestamp checked_at = 3;
  // refreshing means a check is running; read again for its result.
  bool refreshing = 4;
  // error is why the last check failed; quotas then hold the previous result.
  string error = 5;
}

// UsageQuota is one subscription's remaining quota. Remaining values are as
// of observed_at; stale and error qualify them.
message UsageQuota {
  // provider names the subscription's provider, such as claude or codex.
  string provider = 1;
  string account = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated UsageWindow windows = 4;
  // included_usage_allowed is the provider's own answer to whether the
  // subscription still allows included usage; unset when it gives none.
  optional bool included_usage_allowed = 5;
  UsageCredits credits = 6;
  bool stale = 7;
  // error_code and error_message say why the quota is unknown.
  string error_code = 8;
  string error_message = 9;
}

// UsageWindow is a rate-limit window, such as five hours or a week.
message UsageWindow {
  string id = 1;
  string scope_model = 2;
  string scope_surface = 3;
  // remaining_percent is unset when unknown, never zero for unknown.
  optional double remaining_percent = 4;
  google.protobuf.Timestamp resets_at = 5;
  optional int64 duration_seconds = 6;
}

// UsageCredits is a balance of paid credits beyond the subscription.
message UsageCredits {
  optional double remaining = 1;
  optional bool unlimited = 2;
  string unit = 3;
}
