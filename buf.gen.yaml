version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  # The web client's messages and service descriptors, used with
  # @connectrpc/connect-web. Install web/ dependencies first (npm ci).
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
