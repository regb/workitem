name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Check source
        working-directory: docs
        run: npm run check
      - name: Build site
        working-directory: docs
        run: npm run build
      - name: Test built site
        working-directory: docs
        run: npm run test:site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.repository_owner == 'regb' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.repository_owner == 'regb' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
